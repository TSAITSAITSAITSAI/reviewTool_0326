<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北高360時間線</title>
  <style>
    :root {
      --bg: #f5f6f3;
      --card: #ffffff;
      --ink: #1f2722;
      --muted: #65716a;
      --line: #dbe3dd;
      --accent: #0f766e;
      --blue: #2563eb;
      --ok: #15803d;
      --warn: #b45309;
      --danger: #b91c1c;
      --soft: #eef7f4;
      font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    header {
      padding: 18px 0 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .panel, .stop {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(23, 33, 29, 0.08);
    }

    .panel {
      padding: 14px;
      margin: 12px 0 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd6cf;
      border-radius: 8px;
      padding: 9px 11px;
      font: inherit;
      color: var(--ink);
      background: white;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .metric {
      min-width: 0;
      padding: 10px;
      background: var(--soft);
      border-radius: 8px;
    }

    .metric small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 5px;
    }

    .metric strong {
      display: block;
      font-size: 20px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .timeline {
      position: relative;
      display: grid;
      gap: 10px;
      padding-bottom: 18px;
    }

    .stop {
      position: relative;
      overflow: hidden;
    }

    .stop::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: var(--accent);
    }

    .stop.warn::before { background: var(--warn); }
    .stop.danger::before { background: var(--danger); }
    .stop.finish::before { background: var(--blue); }

    .stop-inner {
      padding: 14px 14px 14px 18px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 9px;
    }

    .name {
      font-weight: 800;
      font-size: 17px;
      line-height: 1.25;
    }

    .km {
      flex: 0 0 auto;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      padding-top: 2px;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .timebox {
      padding: 9px 10px;
      border-radius: 8px;
      background: #f7f9f7;
      border: 1px solid #e3e9e5;
      min-width: 0;
    }

    .timebox small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .timebox strong {
      display: block;
      font-size: 18px;
      line-height: 1.15;
      white-space: nowrap;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
      background: #eef2f7;
      color: #34465c;
      white-space: nowrap;
    }

    .badge.ok { background: #dcfce7; color: var(--ok); }
    .badge.warn { background: #fef3c7; color: var(--warn); }
    .badge.danger { background: #fee2e2; color: var(--danger); }

    .route-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.summary-box{padding:10px;border-radius:8px;background:#f7f9f7;border:1px solid #e3e9e5}.summary-box small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.summary-box strong{display:block;font-size:18px}.links { display: grid; gap: 8px; margin-top: 12px; }

    a.button {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      min-height: 42px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--ink);
      text-decoration: none;
      background: white;
      font-size: 14px;
    }

    a.button small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:3px}a.button span:last-child {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .footnote {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      padding: 2px 2px 18px;
    }

    @media (max-width: 520px) {
      .app { padding: 12px; }
      h1 { font-size: 25px; }
      .summary { grid-template-columns: 1fr; }
      .times { grid-template-columns: 1fr 1fr; }
      .metric strong { font-size: 19px; }
      .timebox strong { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>北高360時間線</h1>
      <p>填預計完賽時間與總休息時間，系統把休息平均分配到中途休息點，反推出一路該到的時間。</p>
    </header>

    <section class="panel">
      <label>預計完成時間<input id="finishInput" type="datetime-local" value="2026-11-07T17:30"></label><label>總休息時間（分鐘）<input id="totalRestInput" type="number" min="0" step="1" value="120"></label>
      <div class="summary">
        <div class="metric"><small>需要均速</small><strong id="avgSpeed">--</strong></div>
        <div class="metric"><small>總休息</small><strong id="totalRest">--</strong></div>
        <div class="metric"><small>終點緩衝</small><strong id="finishBuffer">--</strong></div>
      </div>
    </section>

    <section class="panel">
      <h2>Google Maps 路線</h2>
      <p>距離先用目前規劃值。總休息時間會平均分配到所有中途休息點；要校正距離時，開每段地圖看腳踏車距離，再告訴我更新。</p>
      <div class="route-summary" id="routeSummary"></div><div class="links" id="links"></div>
    </section>

    <section class="timeline" id="timeline"></section>

    <p class="footnote">出發時間固定 2026/11/06 22:00。總休息時間平均分配到中途休息點，終點不計休息。距離總和 360 km。</p>
  </main>

  <script>
    const startTime = new Date("2026-11-06T22:00");
    const finishCutoff = new Date("2026-11-07T18:00");
    

    const segments = [
      { from: "八里訊塘廣場", to: "新豐休息站", km: 58 },
      { from: "新豐休息站", to: "台灣中油申昌站", km: 50 },
      { from: "台灣中油申昌站", to: "全家伸港上旺店", km: 55 },
      { from: "全家伸港上旺店", to: "彰化王功福海宮", km: 34, cutoff: "2026-11-07T09:00" },
      { from: "彰化王功福海宮", to: "口湖休息站", km: 48 },
      { from: "口湖休息站", to: "台南將軍吉安宮", km: 36, cutoff: "2026-11-07T15:00" },
      { from: "台南將軍吉安宮", to: "旗哥牛肉湯", km: 28 },
      { from: "旗哥牛肉湯", to: "高雄屏山國小", km: 51, cutoff: "2026-11-07T18:00", finish: true }
    ];

    const finishInput = document.querySelector("#finishInput");
    const totalRestInput = document.querySelector("#totalRestInput");
    finishInput.addEventListener("input", render);
    totalRestInput.addEventListener("input", render);
    renderRouteOverview();
    renderLinks();
    render();

    function render() {
      const finishTime = new Date(finishInput.value);
      const totalKm = segments.reduce((sum, item) => sum + item.km, 0);
      const restStops = segments.filter((item) => !item.finish).length;
      const totalRest = Math.max(0, Number(totalRestInput.value) || 0);
      const restMinutes = restStops > 0 ? totalRest / restStops : 0;
      const totalMinutes = (finishTime - startTime) / 60000;
      const rideMinutes = totalMinutes - totalRest;
      const avgSpeed = rideMinutes > 0 ? totalKm / (rideMinutes / 60) : 0;

      document.querySelector("#avgSpeed").textContent = avgSpeed > 0 ? `${round(avgSpeed)} km/h` : "時間不足";
      document.querySelector("#totalRest").textContent = `${totalRest} 分`;
      document.querySelector("#finishBuffer").textContent = signedDuration((finishCutoff - finishTime) / 60000);
      document.querySelector("#finishBuffer").style.color = finishTime <= finishCutoff ? "var(--ok)" : "var(--danger)";

      const timeline = document.querySelector("#timeline");
      timeline.innerHTML = "";

      let current = new Date(startTime);
      let cumulative = 0;

      segments.forEach((segment, index) => {
        const riding = avgSpeed > 0 ? (segment.km / avgSpeed) * 60 : 0;
        current = addMinutes(current, riding);
        cumulative += segment.km;

        const arrival = new Date(current);
        const depart = segment.finish ? null : addMinutes(arrival, restMinutes);
        const cutoffBadge = makeCutoffBadge(segment, arrival);
        const status = cutoffClass(segment, arrival);

        const card = document.createElement("article");
        card.className = `stop ${status} ${segment.finish ? "finish" : ""}`;
        card.innerHTML = `
          <div class="stop-inner">
            <div class="topline">
              <div class="name">${index + 1}. ${segment.to}</div>
              <div class="km">${segment.km} km / 累計 ${cumulative} km</div>
            </div>
            <div class="times">
              <div class="timebox"><small>抵達</small><strong>${formatDateTime(arrival)}</strong></div>
              <div class="timebox"><small>${segment.finish ? "狀態" : "休 15 分後出發"}</small><strong>${segment.finish ? "完成" : formatDateTime(depart)}</strong></div>
            </div>
            <div class="meta">
              <span class="badge">前段 ${formatDuration(riding)}</span>
              ${segment.finish ? "" : `<span class="badge">休息 ${round(restMinutes)} 分</span>`}
              ${cutoffBadge}
            </div>
          </div>
        `;
        timeline.appendChild(card);

        if (depart) current = depart;
      });
    }

    function renderRouteOverview() {
      const totalKm = segments.reduce((sum, item) => sum + item.km, 0);
      const restStops = segments.filter((item) => !item.finish).length;
      const longest = segments.reduce((max, item) => item.km > max.km ? item : max, segments[0]);
      const officialStops = segments.filter((item) => item.cutoff).length;
      document.querySelector("#routeSummary").innerHTML = `
        <div class="summary-box"><small>總距離</small><strong>${round(totalKm)} km</strong></div>
        <div class="summary-box"><small>中途休息點</small><strong>${restStops} 個</strong></div>
        <div class="summary-box"><small>最長段</small><strong>${longest.from} → ${longest.to}<br>${round(longest.km)} km</strong></div>
        <div class="summary-box"><small>官方關門點</small><strong>${officialStops} 個</strong></div>
      `;
    }

    function renderLinks() {
      const links = document.querySelector("#links");
      links.innerHTML = "";
      segments.forEach((segment, index) => {
        const a = document.createElement("a");
        a.className = "button";
        a.href = mapUrl(segment.from, segment.to);
        a.target = "_blank";
        a.rel = "noreferrer";
        a.innerHTML = `<span>${index + 1}. ${segment.from} → ${segment.to}<br><small>本段 ${round(segment.km)} km，累計 ${round(segments.slice(0, index + 1).reduce((sum, item) => sum + item.km, 0))} km</small></span><span>地圖</span>`;
        links.appendChild(a);
      });
    }

    function makeCutoffBadge(segment, arrival) {
      if (!segment.cutoff) return "";
      const buffer = (new Date(segment.cutoff) - arrival) / 60000;
      const klass = buffer >= 60 ? "ok" : buffer >= 0 ? "warn" : "danger";
      const label = buffer >= 0 ? `關門剩 ${formatDuration(buffer)}` : `超過關門 ${formatDuration(Math.abs(buffer))}`;
      return `<span class="badge ${klass}">${label}</span>`;
    }

    function cutoffClass(segment, arrival) {
      if (!segment.cutoff) return "";
      const buffer = (new Date(segment.cutoff) - arrival) / 60000;
      if (buffer < 0) return "danger";
      if (buffer < 60) return "warn";
      return "";
    }

    function mapUrl(origin, destination) {
      return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&travelmode=bicycling`;
    }

    function addMinutes(date, minutes) {
      return new Date(date.getTime() + minutes * 60000);
    }

    function formatDateTime(date) {
      return `${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")} ${formatTime(date)}`;
    }

    function formatTime(date) {
      return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function formatDuration(minutesValue) {
      const minutes = Math.round(minutesValue);
      const h = Math.floor(minutes / 60);
      const m = Math.abs(minutes % 60);
      return `${h}:${String(m).padStart(2, "0")}`;
    }

    function signedDuration(minutesValue) {
      const sign = minutesValue >= 0 ? "+" : "-";
      return `${sign}${formatDuration(Math.abs(minutesValue))}`;
    }

    function round(value) {
      return Number(value).toFixed(1).replace(/\.0$/, "");
    }
  </script>
</body>
</html>
